
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | TravelBloom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">✈ TravelBloom</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html" class="active">Contact Us</a>
    </div>
  </nav>

  <header class="page-header">
    <h1>Get In Touch</h1>
    <p>
      Have questions about travel destinations?
      We'd love to hear from you.
    </p>
  </header>

  <main class="contact-wrapper">
    <form id="contactForm" class="contact-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name"
               placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email"
               placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject"
               placeholder="What is your inquiry about?" required>
      </div>

      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" rows="6"
                  placeholder="Write your message..."
                  required></textarea>
      </div>

      <button type="submit" class="btn btn-primary">
        Send Message
      </button>

      <p id="formMessage" class="form-message"
         role="status"></p>
    </form>
  </main>

  <footer class="footer">
    <p>© 2026 TravelBloom. Discover the world with us.</p>
  </footer>

  <script>
    const contactForm = document.getElementById("contactForm");

    contactForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const message = document.getElementById("message").value.trim();

      // Replace this with an email address you own.
      const recipient = "YOUR_EMAIL@example.com";

      const body = `Name: ${name}\nEmail: ${email}\n\n${message}`;

      const mailtoLink =
        `mailto:${recipient}?subject=${encodeURIComponent(subject)}` +
        `&body=${encodeURIComponent(body)}`;

      document.getElementById("formMessage").textContent =
        "Opening your email application. Please send the prepared email.";

      window.location.href = mailtoLink;
    });
  </script>

</body>
</html>
